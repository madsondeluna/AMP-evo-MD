<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1086" width="1040" height="1086" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AMP-evo-MD pipeline</title>
  <desc>Three phases: membrane preparation, calibration as a go or no-go gate, and the genetic algorithm campaign. One measurement per candidate feeds two objectives.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a85"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="1040" height="1086" fill="#fcfcfb"/>


  <!-- ===================== STEP 0 ===================== -->
  <rect x="24" y="24" width="992" height="62" rx="6" fill="#fdf3ec" stroke="#D55E00" stroke-width="1.2"/>
  <text x="44" y="48" font-size="13" font-weight="600" fill="#1a1a1a">0. Load the environment</text>
  <text x="44" y="68" font-size="11" fill="#6b6b6b">source ~/amp-env.sh  in every new shell, tmux window and reconnected session. Not optional, does not persist.</text>
  <text x="982" y="48" font-size="11" fill="#8a8a85" text-anchor="end">tools/amp-env.sh.example</text>

  <!-- ===================== PHASE 1 ===================== -->
  <rect x="24" y="100.0" width="992" height="196" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="128.0" font-size="13" font-weight="600" fill="#1a1a1a">1. Membrane preparation</text>
  <text x="44" y="146.0" font-size="11" fill="#6b6b6b">Once per composition. Nothing else runs until this is done.</text>
  <text x="982" y="128.0" font-size="11" fill="#8a8a85" text-anchor="end">tools/protocol.sh</text>

  <!-- boxes -->
  <g font-size="11">
    <rect x="44" y="168.0" width="112" height="46" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="100" y="188.0" text-anchor="middle" fill="#1a1a1a">plan</text>
    <text x="100" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">lipid counts</text>

    <rect x="188" y="168.0" width="112" height="46" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="244" y="188.0" text-anchor="middle" fill="#1a1a1a">build</text>
    <text x="244" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">insane</text>

    <rect x="332" y="168.0" width="132" height="46" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="398" y="188.0" text-anchor="middle" fill="#1a1a1a">equilibrate</text>
    <text x="398" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">semi-isotropic</text>

    <rect x="496" y="168.0" width="132" height="46" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="562" y="188.0" text-anchor="middle" fill="#1a1a1a">production</text>
    <text x="562" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">constant area</text>

    <rect x="660" y="168.0" width="132" height="46" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="726" y="188.0" text-anchor="middle" fill="#1a1a1a">calibrate</text>
    <text x="726" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">4 constants</text>

    <rect x="824" y="168.0" width="158" height="46" rx="4" fill="#eef7f3" stroke="#009E73" stroke-width="1"/>
    <text x="903" y="188.0" text-anchor="middle" fill="#1a1a1a">MembraneDef</text>
    <text x="903" y="204.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">user/membranes.py</text>
  </g>

  <g stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 156 191.0 L 182 191.0"/>
    <path d="M 300 191.0 L 326 191.0"/>
    <path d="M 464 191.0 L 490 191.0"/>
    <path d="M 628 191.0 L 654 191.0"/>
  </g>
  <path d="M 792 191.0 L 818 191.0" stroke="#009E73" stroke-width="1.2" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- second pass loop -->
  <path d="M 398 218.0 L 398 244.0 L 100 244.0 L 100 218.0" stroke="#D55E00" stroke-width="1.2" fill="none"
        stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>
  <text x="252" y="259.0" font-size="10" fill="#D55E00" text-anchor="middle">second pass: measured area per lipid corrects the lipid count, the box stays at 8.0 x 8.0 nm</text>

  <text x="44" y="282.0" font-size="10" fill="#6b6b6b">Checks that must pass: surface tension zero within error, area no longer drifting, leaflets symmetric.</text>

  <!-- ===================== PER-CANDIDATE PIPELINE ===================== -->
  <rect x="24" y="320.0" width="992" height="268" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="348.0" font-size="13" font-weight="600" fill="#1a1a1a">Per-candidate pipeline</text>
  <text x="44" y="366.0" font-size="11" fill="#6b6b6b">One sequence in, one observables file out. Used identically by calibration and by the campaign.</text>

  <g font-size="11">
    <rect x="44" y="388.0" width="124" height="52" rx="4" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1"/>
    <text x="106" y="409.0" text-anchor="middle" fill="#1a1a1a">sequence</text>
    <text x="106" y="425.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">12 to 30 residues</text>

    <rect x="200" y="388.0" width="146" height="52" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="273" y="409.0" text-anchor="middle" fill="#1a1a1a">build peptide</text>
    <text x="273" y="425.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">PeptideBuilder, martinize2</text>

    <!-- two membranes -->
    <rect x="378" y="374.0" width="168" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="462" y="390.0" text-anchor="middle" fill="#1a1a1a">insert into bacterial</text>
    <text x="462" y="405.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">POPE / POPG / cardiolipin</text>

    <rect x="378" y="424.0" width="168" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="462" y="440.0" text-anchor="middle" fill="#1a1a1a">insert into host</text>
    <text x="462" y="455.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">POPC / SM / cholesterol</text>

    <rect x="578" y="388.0" width="140" height="52" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="648" y="409.0" text-anchor="middle" fill="#1a1a1a">production</text>
    <text x="648" y="425.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">400 ns each</text>

    <rect x="750" y="382.0" width="232" height="64" rx="4" fill="#eef7f3" stroke="#009E73" stroke-width="1.4"/>
    <text x="866" y="403.0" text-anchor="middle" fill="#1a1a1a" font-weight="600">observables.json</text>
    <text x="866" y="420.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">surface tension, interaction energy,</text>
    <text x="866" y="433.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">insertion depth, orientation factor</text>
  </g>

  <g stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 168 414.0 L 194 414.0"/>
    <path d="M 346 414.0 L 360 414.0 L 360 394.0 L 372 394.0"/>
    <path d="M 346 414.0 L 360 414.0 L 360 444.0 L 372 444.0"/>
    <path d="M 546 394.0 L 560 394.0 L 560 414.0 L 572 414.0"/>
    <path d="M 546 444.0 L 560 444.0 L 560 414.0"/>
  </g>
  <path d="M 718 414.0 L 744 414.0" stroke="#009E73" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- the two objectives -->
  <g font-size="11">
    <rect x="620" y="488.0" width="172" height="64" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1.4"/>
    <text x="706" y="509.0" text-anchor="middle" fill="#1a1a1a" font-weight="600">damage</text>
    <text x="706" y="525.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">induced leaflet tension</text>
    <text x="706" y="539.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">on the target membrane</text>

    <rect x="810" y="488.0" width="172" height="64" rx="4" fill="#f6f1fa" stroke="#8C5AA8" stroke-width="1.4"/>
    <text x="896" y="509.0" text-anchor="middle" fill="#1a1a1a" font-weight="600">binding</text>
    <text x="896" y="525.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">partitioning selectivity,</text>
    <text x="896" y="539.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">target against host</text>
  </g>

  <g stroke="#009E73" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)">
    <path d="M 866 446.0 L 866 466.0 L 706 466.0 L 706 482.0"/>
    <path d="M 866 446.0 L 866 466.0 L 896 466.0 L 896 482.0"/>
  </g>

  <text x="44" y="508.0" font-size="11" fill="#1a1a1a" font-weight="600">One measurement, two objectives.</text>
  <text x="44" y="526.0" font-size="10.5" fill="#6b6b6b">Both read the same file from the same pair of</text>
  <text x="44" y="542.0" font-size="10.5" fill="#6b6b6b">production runs, so switching between them costs</text>
  <text x="44" y="558.0" font-size="10.5" fill="#6b6b6b">no simulation, and re-scoring a finished campaign</text>
  <text x="44" y="574.0" font-size="10.5" fill="#6b6b6b">under the other is post-processing.</text>

  <!-- ===================== PHASE 2: CALIBRATION GATE ===================== -->
  <rect x="24" y="612.0" width="486" height="212" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="640.0" font-size="13" font-weight="600" fill="#1a1a1a">2. Calibration</text>
  <text x="44" y="658.0" font-size="11" fill="#6b6b6b">No genetic algorithm. The go or no-go for everything after.</text>
  <text x="490" y="640.0" font-size="11" fill="#8a8a85" text-anchor="end">run.py STATE = 1</text>

  <g font-size="11">
    <rect x="44" y="678.0" width="186" height="58" rx="4" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1"/>
    <text x="137" y="698.0" text-anchor="middle" fill="#1a1a1a">known peptides</text>
    <text x="137" y="714.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">inactive, selective, lytic,</text>
    <text x="137" y="727.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">binds without lysing</text>

    <rect x="262" y="678.0" width="228" height="58" rx="4" fill="#fdf3ec" stroke="#D55E00" stroke-width="1.4"/>
    <text x="376" y="698.0" text-anchor="middle" fill="#1a1a1a" font-weight="600">do the observables</text>
    <text x="376" y="714.0" text-anchor="middle" fill="#1a1a1a" font-weight="600">separate the classes?</text>
    <text x="376" y="729.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">calibrate.py</text>
  </g>
  <path d="M 230 707.0 L 256 707.0" stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <text x="44" y="764.0" font-size="10.5" fill="#6b6b6b">No: stop. An optimiser cannot recover a signal that is</text>
  <text x="44" y="780.0" font-size="10.5" fill="#6b6b6b">not in the observable. Revisit the observable, the</text>
  <text x="44" y="796.0" font-size="10.5" fill="#6b6b6b">membranes, or the imposed-helix assumption.</text>
  <text x="44" y="814.0" font-size="10.5" fill="#009E73">Yes: the class boundaries set the window. Continue.</text>

  <!-- ===================== PHASE 3: CAMPAIGN ===================== -->
  <rect x="530" y="612.0" width="486" height="212" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="550" y="640.0" font-size="13" font-weight="600" fill="#1a1a1a">3. Campaign</text>
  <text x="550" y="658.0" font-size="11" fill="#6b6b6b">Genetic algorithm, random initial population.</text>
  <text x="996" y="640.0" font-size="11" fill="#8a8a85" text-anchor="end">run.py STATE = 0</text>

  <g font-size="10.5">
    <rect x="550" y="676.0" width="128" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="614" y="693.0" text-anchor="middle" fill="#1a1a1a">population</text>
    <text x="614" y="707.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">144 sequences</text>

    <rect x="712" y="676.0" width="128" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="776" y="693.0" text-anchor="middle" fill="#1a1a1a">evaluate</text>
    <text x="776" y="707.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">pipeline above</text>

    <rect x="874" y="676.0" width="122" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="935" y="693.0" text-anchor="middle" fill="#1a1a1a">select</text>
    <text x="935" y="707.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">36 parents</text>

    <rect x="712" y="752.0" width="128" height="40" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="776" y="769.0" text-anchor="middle" fill="#1a1a1a">crossover</text>
    <text x="776" y="783.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">and mutate</text>
  </g>

  <g stroke="#0072B2" stroke-width="1.2" fill="none" marker-end="url(#arrowBlue)">
    <path d="M 678 696.0 L 706 696.0"/>
    <path d="M 840 696.0 L 868 696.0"/>
    <path d="M 935 716.0 L 935 772.0 L 846 772.0"/>
    <path d="M 712 772.0 L 614 772.0 L 614 722.0"/>
  </g>

  <text x="550" y="806.0" font-size="10.5" fill="#6b6b6b">Random initialisation, never seeded. Convergence from independent</text>
  <text x="550" y="820.0" font-size="10.5" fill="#6b6b6b">runs is the only available evidence of a global optimum.</text>

  <!-- ===================== MONITORING ===================== -->
  <rect x="24" y="848.0" width="992" height="140" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="876.0" font-size="13" font-weight="600" fill="#1a1a1a">Monitoring, while it runs</text>
  <text x="982" y="876.0" font-size="11" fill="#8a8a85" text-anchor="end">tools/ga_report.py</text>

  <g font-size="11">
    <rect x="44" y="896.0" width="222" height="68" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="155" y="917.0" text-anchor="middle" fill="#1a1a1a">fitness</text>
    <text x="155" y="934.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">best, parent pool, population</text>
    <text x="155" y="950.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">mean per iteration</text>

    <rect x="286" y="896.0" width="222" height="68" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="397" y="917.0" text-anchor="middle" fill="#1a1a1a">diversity</text>
    <text x="397" y="934.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">pairwise distance and</text>
    <text x="397" y="950.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">positional entropy</text>

    <rect x="528" y="896.0" width="222" height="68" rx="4" fill="#f2f7fb" stroke="#0072B2" stroke-width="1"/>
    <text x="639" y="917.0" text-anchor="middle" fill="#1a1a1a">composition</text>
    <text x="639" y="934.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">residue groups over time,</text>
    <text x="639" y="950.0" text-anchor="middle" fill="#6b6b6b" font-size="9.5">frequency by position</text>
  </g>

  <text x="774" y="917.0" font-size="10.5" fill="#1a1a1a" font-weight="600">Read fitness and diversity together.</text>
  <text x="774" y="934.0" font-size="10.5" fill="#6b6b6b">Rising fitness alone cannot distinguish a found</text>
  <text x="774" y="950.0" font-size="10.5" fill="#6b6b6b">motif from a collapsed population. Positional</text>
  <text x="774" y="966.0" font-size="10.5" fill="#6b6b6b">entropy separates them.</text>

  <text x="44" y="1022.0" font-size="10" fill="#8a8a85">Box 8.0 x 8.0 nm, Martini 3, constant-area ensemble. The constant-area coupling is load-bearing: under a constant-tension barostat the area would</text>
  <text x="44" y="1038.0" font-size="10" fill="#8a8a85">respond instead of the surface tension, and the damage observable would vanish.</text>
</svg>