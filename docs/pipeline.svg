<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1120" width="1040" height="1120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AMP-evo-MD pipeline</title>
  <desc>Three phases: preparation of the bacterial target membrane, calibration as a go or no-go gate, and the genetic algorithm campaign. One measurement per candidate feeds a single damage objective on the target membrane, and every pipeline step is logged with its duration and outcome. Boxes are coloured by process: membrane preparation, the shared per-candidate pipeline, the campaign, monitoring, inputs and produced data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a85"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1040" height="1120" fill="#fcfcfb"/>

  <!-- ===================== STEP 0 ===================== -->
  <rect x="24" y="24" width="992" height="62" rx="6" fill="#fdf3ec" stroke="#D55E00" stroke-width="1.2"/>
  <text x="44" y="52" font-size="13" font-weight="600" fill="#1a1a1a">0. Load the environment</text>
  <text x="44" y="72" font-size="11" fill="#6b6b6b">source ~/amp-env.sh  in every new shell, tmux window and reconnected session. Not optional, does not persist.</text>
  <text x="996" y="52" font-size="11" fill="#8a8a85" text-anchor="end">tools/amp-env.sh.example</text>

  <!-- ===================== PHASE 1: MEMBRANE PREPARATION ===================== -->
  <rect x="24" y="104" width="992" height="190" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="132" font-size="13" font-weight="600" fill="#1a1a1a">1. Membrane preparation</text>
  <text x="44" y="150" font-size="11" fill="#6b6b6b">Once per composition; nothing else runs until it is done. The equilibrated membrane is committed and reused, so it reproduces on any machine.</text>
  <text x="996" y="132" font-size="11" fill="#8a8a85" text-anchor="end">tools/protocol.sh</text>

  <!-- six-box row: five preparation steps (blue) then the produced definition (green) -->
  <g font-size="11">
    <rect x="44"  y="170" width="142" height="48" rx="4" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="115" y="192" text-anchor="middle" fill="#1a1a1a">plan</text>
    <text x="115" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">lipid counts</text>

    <rect x="206" y="170" width="142" height="48" rx="4" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="277" y="192" text-anchor="middle" fill="#1a1a1a">build</text>
    <text x="277" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">insane</text>

    <rect x="368" y="170" width="142" height="48" rx="4" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="439" y="192" text-anchor="middle" fill="#1a1a1a">equilibrate</text>
    <text x="439" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">semi-isotropic, 500 ns</text>

    <rect x="530" y="170" width="142" height="48" rx="4" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="601" y="192" text-anchor="middle" fill="#1a1a1a">production</text>
    <text x="601" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">constant area</text>

    <rect x="692" y="170" width="142" height="48" rx="4" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="763" y="192" text-anchor="middle" fill="#1a1a1a">calibrate</text>
    <text x="763" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">4 constants</text>

    <rect x="854" y="170" width="142" height="48" rx="4" fill="#e9f6f1" stroke="#009E73" stroke-width="1"/>
    <text x="925" y="192" text-anchor="middle" fill="#1a1a1a">MembraneDef</text>
    <text x="925" y="208" text-anchor="middle" fill="#6b6b6b" font-size="9.5">user/membranes.py</text>
  </g>

  <g stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 188 194 L 204 194"/>
    <path d="M 350 194 L 366 194"/>
    <path d="M 512 194 L 528 194"/>
    <path d="M 674 194 L 690 194"/>
  </g>
  <path d="M 836 194 L 852 194" stroke="#009E73" stroke-width="1.2" fill="none" marker-end="url(#arrowGreen)"/>

  <text x="44" y="246" font-size="10.5" fill="#6b6b6b">Accepted when: surface tension zero within error, area no longer drifting, leaflets symmetric.</text>
  <text x="44" y="268" font-size="10.5" fill="#6b6b6b">Target-only: one bacterial membrane (POPE:POPG 70:30). Production runs on the equilibrated box directly. The host is archived in user/membranes.py (see the README pivot note).</text>

  <!-- ===================== PER-CANDIDATE PIPELINE ===================== -->
  <rect x="24" y="318" width="992" height="268" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="346" font-size="13" font-weight="600" fill="#1a1a1a">Per-candidate pipeline</text>
  <text x="44" y="364" font-size="11" fill="#6b6b6b">One sequence in, one observables file out. Used identically by calibration and by the campaign.</text>

  <!-- flow row: input (grey), build + insert + production (sky), observables (green) -->
  <g font-size="11">
    <rect x="44"  y="392" width="120" height="52" rx="4" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1"/>
    <text x="104" y="414" text-anchor="middle" fill="#1a1a1a">sequence</text>
    <text x="104" y="430" text-anchor="middle" fill="#6b6b6b" font-size="9.5">12 to 30 residues</text>

    <rect x="196" y="392" width="140" height="52" rx="4" fill="#eaf4fc" stroke="#2E8BC0" stroke-width="1"/>
    <text x="266" y="414" text-anchor="middle" fill="#1a1a1a">build peptide</text>
    <text x="266" y="430" text-anchor="middle" fill="#6b6b6b" font-size="9.5">PeptideBuilder, martinize2</text>

    <rect x="368" y="392" width="150" height="52" rx="4" fill="#eaf4fc" stroke="#2E8BC0" stroke-width="1"/>
    <text x="443" y="414" text-anchor="middle" fill="#1a1a1a">insert into target</text>
    <text x="443" y="430" text-anchor="middle" fill="#6b6b6b" font-size="9.5">bacterial POPE:POPG 70:30</text>

    <rect x="550" y="392" width="130" height="52" rx="4" fill="#eaf4fc" stroke="#2E8BC0" stroke-width="1"/>
    <text x="615" y="414" text-anchor="middle" fill="#1a1a1a">production</text>
    <text x="615" y="430" text-anchor="middle" fill="#6b6b6b" font-size="9.5">3 replicas x 200 ns</text>

    <rect x="712" y="386" width="284" height="64" rx="4" fill="#e9f6f1" stroke="#009E73" stroke-width="1.4"/>
    <text x="854" y="407" text-anchor="middle" fill="#1a1a1a" font-weight="600">observables.json</text>
    <text x="854" y="424" text-anchor="middle" fill="#6b6b6b" font-size="9.5">surface tension, interaction energy,</text>
    <text x="854" y="438" text-anchor="middle" fill="#6b6b6b" font-size="9.5">insertion depth, orientation factor</text>
  </g>

  <g stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 166 418 L 194 418"/>
    <path d="M 338 418 L 366 418"/>
    <path d="M 518 418 L 548 418"/>
  </g>
  <path d="M 680 418 L 710 418" stroke="#009E73" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- single objective: damage (vermillion) on the target membrane -->
  <g font-size="11">
    <rect x="786" y="486" width="136" height="64" rx="4" fill="#fcefe7" stroke="#D55E00" stroke-width="1.4"/>
    <text x="854" y="507" text-anchor="middle" fill="#1a1a1a" font-weight="600">damage</text>
    <text x="854" y="523" text-anchor="middle" fill="#6b6b6b" font-size="9.5">induced leaflet tension</text>
    <text x="854" y="537" text-anchor="middle" fill="#6b6b6b" font-size="9.5">on the target membrane</text>
  </g>

  <g stroke="#009E73" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)">
    <path d="M 854 450 L 854 484"/>
  </g>

  <text x="44" y="502" font-size="11" fill="#1a1a1a" font-weight="600">One measurement, one objective.</text>
  <text x="44" y="520" font-size="10.5" fill="#6b6b6b">Target-only pivot: damage on the bacterial membrane.</text>
  <text x="44" y="536" font-size="10.5" fill="#6b6b6b">Host selectivity is future work (see the README). A</text>
  <text x="44" y="552" font-size="10.5" fill="#6b6b6b">binding objective still exists in the code, read from</text>
  <text x="44" y="568" font-size="10.5" fill="#6b6b6b">the same file, but is not used in this study.</text>

  <text x="330" y="502" font-size="11" fill="#1a1a1a" font-weight="600">Every step is logged.</text>
  <text x="330" y="520" font-size="10.5" fill="#6b6b6b">One record per step in steps.jsonl, named</text>
  <text x="330" y="536" font-size="10.5" fill="#6b6b6b">build_peptide, insert, production, observables,</text>
  <text x="330" y="552" font-size="10.5" fill="#6b6b6b">fitness, with its duration and outcome. On failure</text>
  <text x="330" y="568" font-size="10.5" fill="#6b6b6b">the working directory is kept as failed_&lt;step&gt;/.</text>

  <!-- ===================== PHASE 2: CALIBRATION GATE ===================== -->
  <rect x="24" y="610" width="486" height="212" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="638" font-size="13" font-weight="600" fill="#1a1a1a">2. Calibration</text>
  <text x="44" y="656" font-size="11" fill="#6b6b6b">No genetic algorithm. The go or no-go for everything after.</text>
  <text x="490" y="638" font-size="11" fill="#8a8a85" text-anchor="end">run.py STATE = 1</text>

  <g font-size="11">
    <rect x="44" y="676" width="186" height="58" rx="4" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1"/>
    <text x="137" y="696" text-anchor="middle" fill="#1a1a1a">known peptides</text>
    <text x="137" y="712" text-anchor="middle" fill="#6b6b6b" font-size="9.5">6 active (selective + lytic),</text>
    <text x="137" y="725" text-anchor="middle" fill="#6b6b6b" font-size="9.5">3 inactive (scramble controls)</text>

    <rect x="262" y="676" width="228" height="58" rx="4" fill="#fdf3ec" stroke="#D55E00" stroke-width="1.4"/>
    <text x="376" y="696" text-anchor="middle" fill="#1a1a1a" font-weight="600">do the observables</text>
    <text x="376" y="712" text-anchor="middle" fill="#1a1a1a" font-weight="600">separate active from inactive?</text>
    <text x="376" y="727" text-anchor="middle" fill="#6b6b6b" font-size="9.5">calibrate.py, 3 replicas per peptide</text>
  </g>
  <path d="M 230 705 L 258 705" stroke="#8a8a85" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <text x="44" y="762" font-size="10.5" fill="#6b6b6b">No: stop. An optimiser cannot recover a signal that is not in the</text>
  <text x="44" y="778" font-size="10.5" fill="#6b6b6b">observable. Revisit the observable, the sampling, or the imposed-helix assumption.</text>
  <text x="44" y="802" font-size="10.5" fill="#009E73">Yes: the active/inactive boundary sets the scoring window. Continue to the campaign.</text>

  <!-- ===================== PHASE 3: CAMPAIGN (amber) ===================== -->
  <rect x="530" y="610" width="486" height="212" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="550" y="638" font-size="13" font-weight="600" fill="#1a1a1a">3. Campaign</text>
  <text x="550" y="656" font-size="11" fill="#6b6b6b">Genetic algorithm, random initial population.</text>
  <text x="996" y="638" font-size="11" fill="#8a8a85" text-anchor="end">run.py STATE = 0</text>

  <g font-size="10.5">
    <rect x="550" y="672" width="130" height="38" rx="4" fill="#fdf4e3" stroke="#E69F00" stroke-width="1"/>
    <text x="615" y="689" text-anchor="middle" fill="#1a1a1a">population</text>
    <text x="615" y="702" text-anchor="middle" fill="#6b6b6b" font-size="9.5">144 sequences</text>

    <rect x="706" y="672" width="130" height="38" rx="4" fill="#fdf4e3" stroke="#E69F00" stroke-width="1"/>
    <text x="771" y="689" text-anchor="middle" fill="#1a1a1a">evaluate</text>
    <text x="771" y="702" text-anchor="middle" fill="#6b6b6b" font-size="9.5">pipeline above</text>

    <rect x="862" y="672" width="134" height="38" rx="4" fill="#fdf4e3" stroke="#E69F00" stroke-width="1"/>
    <text x="929" y="689" text-anchor="middle" fill="#1a1a1a">select</text>
    <text x="929" y="702" text-anchor="middle" fill="#6b6b6b" font-size="9.5">36 parents</text>

    <rect x="706" y="740" width="130" height="38" rx="4" fill="#fdf4e3" stroke="#E69F00" stroke-width="1"/>
    <text x="771" y="757" text-anchor="middle" fill="#1a1a1a">crossover</text>
    <text x="771" y="770" text-anchor="middle" fill="#6b6b6b" font-size="9.5">and mutate</text>
  </g>

  <g stroke="#E69F00" stroke-width="1.2" fill="none" marker-end="url(#arrowAmber)">
    <path d="M 680 691 L 704 691"/>
    <path d="M 836 691 L 860 691"/>
    <path d="M 929 710 L 929 759 L 838 759"/>
    <path d="M 706 759 L 615 759 L 615 712"/>
  </g>

  <text x="550" y="800" font-size="10.5" fill="#6b6b6b">Random initialisation, never seeded. Convergence from</text>
  <text x="550" y="814" font-size="10.5" fill="#6b6b6b">independent runs is the only evidence of a global optimum.</text>

  <!-- ===================== MONITORING (slate) ===================== -->
  <rect x="24" y="846" width="992" height="140" rx="6" fill="#ffffff" stroke="#e6e6e2" stroke-width="1"/>
  <text x="44" y="874" font-size="13" font-weight="600" fill="#1a1a1a">Monitoring, while it runs</text>
  <text x="996" y="874" font-size="11" fill="#8a8a85" text-anchor="end">tools/ga_report.py</text>

  <g font-size="11">
    <rect x="44"  y="894" width="164" height="68" rx="4" fill="#f0f1f4" stroke="#7d8795" stroke-width="1"/>
    <text x="126" y="915" text-anchor="middle" fill="#1a1a1a">fitness</text>
    <text x="126" y="932" text-anchor="middle" fill="#6b6b6b" font-size="9.5">best, parent pool,</text>
    <text x="126" y="948" text-anchor="middle" fill="#6b6b6b" font-size="9.5">population mean</text>

    <rect x="224" y="894" width="164" height="68" rx="4" fill="#f0f1f4" stroke="#7d8795" stroke-width="1"/>
    <text x="306" y="915" text-anchor="middle" fill="#1a1a1a">diversity</text>
    <text x="306" y="932" text-anchor="middle" fill="#6b6b6b" font-size="9.5">pairwise distance and</text>
    <text x="306" y="948" text-anchor="middle" fill="#6b6b6b" font-size="9.5">positional entropy</text>

    <rect x="404" y="894" width="164" height="68" rx="4" fill="#f0f1f4" stroke="#7d8795" stroke-width="1"/>
    <text x="486" y="915" text-anchor="middle" fill="#1a1a1a">composition</text>
    <text x="486" y="932" text-anchor="middle" fill="#6b6b6b" font-size="9.5">residue groups over time,</text>
    <text x="486" y="948" text-anchor="middle" fill="#6b6b6b" font-size="9.5">frequency by position</text>

    <rect x="584" y="894" width="164" height="68" rx="4" fill="#f0f1f4" stroke="#7d8795" stroke-width="1"/>
    <text x="666" y="915" text-anchor="middle" fill="#1a1a1a">timing</text>
    <text x="666" y="932" text-anchor="middle" fill="#6b6b6b" font-size="9.5">per step: median, p90,</text>
    <text x="666" y="948" text-anchor="middle" fill="#6b6b6b" font-size="9.5">share of wall time</text>
  </g>

  <text x="774" y="915" font-size="10.5" fill="#1a1a1a" font-weight="600">Read fitness and diversity together.</text>
  <text x="774" y="933" font-size="10.5" fill="#6b6b6b">Rising fitness alone cannot distinguish a found</text>
  <text x="774" y="949" font-size="10.5" fill="#6b6b6b">motif from a collapsed population. Positional</text>
  <text x="774" y="965" font-size="10.5" fill="#6b6b6b">entropy separates them.</text>

  <!-- ===================== LEGEND ===================== -->
  <text x="44" y="1012" font-size="11" font-weight="600" fill="#1a1a1a">Boxes are coloured by process</text>
  <g font-size="10">
    <rect x="44"  y="1024" width="14" height="12" rx="2" fill="#eef5fb" stroke="#0072B2" stroke-width="1"/>
    <text x="64"  y="1034" fill="#6b6b6b">membrane preparation</text>

    <rect x="214" y="1024" width="14" height="12" rx="2" fill="#eaf4fc" stroke="#2E8BC0" stroke-width="1"/>
    <text x="234" y="1034" fill="#6b6b6b">per-candidate pipeline</text>

    <rect x="384" y="1024" width="14" height="12" rx="2" fill="#fdf4e3" stroke="#E69F00" stroke-width="1"/>
    <text x="404" y="1034" fill="#6b6b6b">campaign (genetic algorithm)</text>

    <rect x="594" y="1024" width="14" height="12" rx="2" fill="#f0f1f4" stroke="#7d8795" stroke-width="1"/>
    <text x="614" y="1034" fill="#6b6b6b">monitoring</text>

    <rect x="714" y="1024" width="14" height="12" rx="2" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1"/>
    <text x="734" y="1034" fill="#6b6b6b">input</text>

    <rect x="794" y="1024" width="14" height="12" rx="2" fill="#e9f6f1" stroke="#009E73" stroke-width="1"/>
    <text x="814" y="1034" fill="#6b6b6b">produced data</text>

    <rect x="914" y="1024" width="14" height="12" rx="2" fill="#fcefe7" stroke="#D55E00" stroke-width="1"/>
    <text x="934" y="1034" fill="#6b6b6b">objective</text>
  </g>

  <text x="44" y="1072" font-size="10" fill="#8a8a85">Box 8.0 x 8.0 nm, Martini 3, constant-area ensemble. The constant-area coupling is load-bearing: under a constant-tension barostat the area would</text>
  <text x="44" y="1088" font-size="10" fill="#8a8a85">respond instead of the surface tension, and the damage observable would vanish.</text>
  <text x="44" y="1108" font-size="10" fill="#8a8a85">The equilibrated membrane is a committed, versioned reference (tools/build_reference_membranes.sh); the campaign checkpoints each iteration and resumes with --restart.</text>
</svg>
